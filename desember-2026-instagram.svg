<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Promo servis dan tebus murah Desember 2026</title>
  <desc id="desc">Poster Instagram STEPAT Digital Motoshop. Servis CVT dan throttle body mulai 100 ribu rupiah, pilihan tebus murah mulai 65 ribu rupiah, bonus Engine Clean 50 ml untuk motor tahun 2020 ke atas. Periode 1 sampai 31 Desember 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfc"/><stop offset="1" stop-color="#e8f1f3"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5738"/><stop offset="1" stop-color="#e52c18"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#20272b"/><stop offset="1" stop-color="#0c1114"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#152b33" flood-opacity=".12"/></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#d4e2e5"/></pattern>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <circle cx="1010" cy="92" r="220" fill="#e2f0f2"/><circle cx="65" cy="585" r="180" fill="url(#dots)" opacity=".55"/>
  <path d="M0 0h1080v18H0z" fill="url(#red)"/>

  <!-- Brand / seasonal header -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="52" width="46" height="46" rx="13" fill="url(#red)"/>
    <path d="M77 82V66h8l5 8 5-8h8v16h-7v-7l-6 7-6-7v7z" fill="#fff"/>
    <text x="124" y="73" font-size="23" font-weight="800" letter-spacing="1.3" fill="#172126">STEPAT</text>
    <text x="124" y="94" font-size="12" font-weight="700" letter-spacing="2" fill="#748287">DIGITAL MOTOSHOP</text>
    <rect x="770" y="53" width="246" height="44" rx="22" fill="#fff" stroke="#d7e3e5"/>
    <circle cx="796" cy="75" r="7" fill="#20a99a"/><text x="814" y="82" font-size="16" font-weight="700" letter-spacing="1" fill="#273237">PROMO AKHIR TAHUN</text>

    <text x="64" y="166" font-size="17" font-weight="800" letter-spacing="4" fill="#e9472d">DESEMBER 2026</text>
    <text x="60" y="244" font-size="66" font-weight="900" letter-spacing="-2" fill="#101719">TUTUP TAHUN,</text>
    <text x="60" y="316" font-size="66" font-weight="900" letter-spacing="-2" fill="#101719">MOTOR MAKIN <tspan fill="#ef4b2d">PRIMA.</tspan></text>
    <text x="64" y="356" font-size="21" font-weight="500" fill="#56656a">Rawat kendaraanmu, nikmati promo spesial bulan ini.</text>
  </g>

  <!-- Service offer hero -->
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="398" width="968" height="310" rx="30" fill="#fff"/>
    <path d="M56 428q0-30 30-30h908q30 0 30 30v58H56z" fill="url(#dark)"/>
    <rect x="82" y="420" width="10" height="42" rx="5" fill="#ff5536"/>
    <text x="112" y="453" font-size="22" font-weight="800" letter-spacing="2" fill="#fff">PAKET SERVIS SPESIAL</text>
    <rect x="817" y="416" width="174" height="38" rx="19" fill="#ffffff" opacity=".13"/>
    <text x="904" y="441" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#fff">HEMAT BULAN INI</text>
    <text x="88" y="548" font-size="55" font-weight="900" letter-spacing="-1.5" fill="#11191c">SERVIS <tspan fill="#ef4b2d">CVT + TB</tspan></text>
    <text x="91" y="582" font-size="18" font-weight="800" letter-spacing="2.5" fill="#536166">THROTTLE BODY DIBONGKAR</text>
    <circle cx="99" cy="614" r="4" fill="#ef4b2d"/><text x="113" y="621" font-size="17" font-weight="700" letter-spacing="1.4" fill="#273237">NITROGEN</text>
    <circle cx="99" cy="645" r="4" fill="#ef4b2d"/><text x="113" y="652" font-size="17" font-weight="700" letter-spacing="1.4" fill="#273237">+ 20 POIN CEK</text>
    <text x="602" y="543" font-size="25" font-weight="700" fill="#a2abad">170 RB</text>
    <path d="M595 529l127 2" stroke="#ef4b2d" stroke-width="4" stroke-linecap="round"/>
    <rect x="744" y="502" width="233" height="143" rx="22" fill="#fff2ed"/>
    <text x="765" y="533" font-size="14" font-weight="800" letter-spacing="2" fill="#d7472d">SEKARANG</text>
    <text x="759" y="610" font-size="91" font-weight="900" letter-spacing="-6" fill="#101719">100</text>
    <text x="917" y="610" font-size="28" font-weight="900" fill="#101719">RB*</text>
    <text x="765" y="633" font-size="13" font-weight="700" fill="#748287">*S&amp;K BERLAKU</text>
  </g>

