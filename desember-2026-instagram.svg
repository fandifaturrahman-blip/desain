    <g filter="url(#shadow)"><rect x="56" y="831" width="302" height="284" rx="24" fill="#fff"/>
      <rect x="78" y="853" width="116" height="29" rx="14" fill="#e9f5f3"/><text x="136" y="873" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1" fill="#138f83">TEBUS MURAH</text>
      <text x="78" y="949" font-size="53" font-weight="900" letter-spacing="-2" fill="#11191c">+65</text><text x="186" y="949" font-size="19" font-weight="900" fill="#11191c">RB*</text>
      <text x="80" y="978" font-size="15" font-weight="700" fill="#647277">Oli mesin</text><text x="80" y="1002" font-size="15" font-weight="700" fill="#647277">0,6–0,8 L</text>
      <!-- generic oil bottle -->
      <path d="M244 900h42v12h8v18l12 15v91q0 12-12 12h-64q-12 0-12-12v-91l12-15v-18h8v-12z" fill="#273c5a"/>
      <rect x="251" y="887" width="29" height="15" rx="4" fill="#e9472d"/><path d="M224 944h70v48h-70z" fill="#ecf3f5"/><path d="M232 952h54v29h-54z" fill="#e9472d"/><text x="259" y="972" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">MOTOR OIL</text>
      <path d="M78 1040h258" stroke="#e9eeee" stroke-width="2"/><text x="78" y="1074" font-size="13" font-weight="700" fill="#758287">*Harga promo per paket</text>
    </g>
    <!-- Deal 2 -->
    <g filter="url(#shadow)"><rect x="389" y="831" width="302" height="284" rx="24" fill="#fff"/>
      <rect x="411" y="853" width="116" height="29" rx="14" fill="#e9f5f3"/><text x="469" y="873" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1" fill="#138f83">TEBUS MURAH</text>
      <text x="411" y="949" font-size="53" font-weight="900" letter-spacing="-2" fill="#11191c">+80</text><text x="519" y="949" font-size="19" font-weight="900" fill="#11191c">RB*</text>
      <text x="413" y="978" font-size="15" font-weight="700" fill="#647277">Oli mesin</text><text x="413" y="1002" font-size="15" font-weight="700" fill="#647277">0,8–1 L</text>
      <path d="M577 900h42v12h8v18l12 15v91q0 12-12 12h-64q-12 0-12-12v-91l12-15v-18h8v-12z" fill="#3c6597"/><rect x="584" y="887" width="29" height="15" rx="4" fill="#1c4b96"/><path d="M557 944h70v48h-70z" fill="#ecf3f5"/><path d="M565 952h54v29h-54z" fill="#e9472d"/><text x="592" y="972" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">MOTOR OIL</text>
      <path d="M411 1040h258" stroke="#e9eeee" stroke-width="2"/><text x="411" y="1074" font-size="13" font-weight="700" fill="#758287">*Harga promo per paket</text>
    </g>
    <!-- Deal 3 -->
    <g filter="url(#shadow)"><rect x="722" y="831" width="302" height="284" rx="24" fill="#fff"/>
      <rect x="744" y="853" width="116" height="29" rx="14" fill="#e9f5f3"/><text x="802" y="873" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="1" fill="#138f83">TEBUS MURAH</text>
      <text x="744" y="949" font-size="53" font-weight="900" letter-spacing="-2" fill="#11191c">+99</text><text x="852" y="949" font-size="19" font-weight="900" fill="#11191c">RB*</text>
      <text x="746" y="978" font-size="15" font-weight="700" fill="#647277">Oli mesin</text><text x="746" y="1002" font-size="15" font-weight="700" fill="#647277">0,8 / 1 L</text>
      <path d="M910 900h42v12h8v18l12 15v91q0 12-12 12h-64q-12 0-12-12v-91l12-15v-18h8v-12z" fill="#202b32"/><rect x="917" y="887" width="29" height="15" rx="4" fill="#e9472d"/><path d="M890 944h70v48h-70z" fill="#ecf3f5"/><path d="M898 952h54v29h-54z" fill="#e9472d"/><text x="925" y="972" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">MOTOR OIL</text>
      <path d="M744 1040h258" stroke="#e9eeee" stroke-width="2"/><text x="744" y="1074" font-size="13" font-weight="700" fill="#758287">*Harga promo per paket</text>
    </g>
  </g>

  <!-- Bonus and footer -->
  <g font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <rect x="56" y="1144" width="968" height="112" rx="24" fill="url(#red)"/>
    <circle cx="112" cy="1200" r="31" fill="#fff" opacity=".18"/><path d="M99 1200l9 9 18-21" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="163" y="1185" font-size="14" font-weight="800" letter-spacing="2" fill="#ffe4dc">BONUS UNTUKMU</text>
    <text x="163" y="1222" font-size="31" font-weight="900" fill="#fff">GRATIS ENGINE CLEAN 50 ML</text>
    <rect x="747" y="1172" width="244" height="57" rx="14" fill="#fff"/>
    <text x="869" y="1195" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="1" fill="#df4328">KHUSUS MOTOR</text>
    <text x="869" y="1217" text-anchor="middle" font-size="19" font-weight="900" fill="#172126">TAHUN 2020 KE ATAS</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="1295" font-size="15" font-weight="800" letter-spacing="1.4" fill="#1b2529">PERIODE 1–31 DESEMBER 2026</text>
    <text x="1016" y="1295" text-anchor="end" font-size="14" font-weight="700" fill="#748287">Syarat &amp; ketentuan berlaku • Selama persediaan ada</text>
    <path d="M64 1315h952" stroke="#d5e0e2" stroke-width="2"/>
    <text x="540" y="1340" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#8b999d">CEK PROMO &amp; KUNJUNGI STEPAT DIGITAL MOTOSHOP</text>
  </g>
</svg>
