  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="763" font-size="16" font-weight="800" letter-spacing="3" fill="#e9472d">PILIHAN TEBUS MURAH</text>
    <text x="64" y="801" font-size="31" font-weight="900" letter-spacing="-.5" fill="#152024">Tambah hemat, sekalian siap jalan.</text>

