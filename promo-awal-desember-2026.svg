<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<title>Awali Desember Makin Prima — Promo Servis STEPAT</title>
<desc>Artwork promosi Instagram ukuran 1080 x 1350. Promo servis CVT plus throttle body 100 ribu rupiah, tebus murah oli mulai 65 ribu rupiah, gratis Engine Clean 50 ml untuk motor tahun 2020 ke atas. Periode 1–10 Desember 2026. File vektor editable untuk Adobe Illustrator.</desc>
<defs>
